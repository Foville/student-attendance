<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นักเรียน</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Kanit,sans-serif;background:#080808;color:#fff}.glass{background:#ffffff0d;border:1px solid #ffffff18;backdrop-filter:blur(18px)}select{background:#ffffff0d;color:#fff}option{background:#111}</style></head><body><nav class="glass p-4"><div class="max-w-6xl mx-auto flex justify-between"><b>🎓 ระบบเช็กชื่อ</b><button onclick="logout()" class="px-4 py-2 rounded-xl bg-white/10">ออกจากระบบ</button></div></nav><main class="max-w-6xl mx-auto p-5"><div class="glass rounded-3xl p-6"><p class="text-gray-400">นักเรียน</p><h1 id="name" class="text-3xl font-bold"></h1><p id="cls" class="text-gray-400"></p><p id="sid" class="text-gray-500"></p></div><div class="glass rounded-3xl p-6 mt-5"><h2 class="text-xl font-semibold mb-4">เช็กชื่อวันนี้</h2><div class="flex gap-3"><select id="sub" class="rounded-xl p-3 flex-1"></select><button onclick="checkin()" class="bg-white text-black rounded-xl px-5 font-semibold">✓ เช็กชื่อ</button></div><p id="msg" class="mt-3"></p></div><div id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5"></div><div class="glass rounded-3xl p-5 mt-5 overflow-x-auto"><h2 class="text-xl font-semibold mb-4">ประวัติการเข้าเรียน</h2><table class="w-full"><thead><tr class="text-gray-400"><th class="p-3">วันที่</th><th class="p-3">วิชา</th><th class="p-3">สถานะ</th><th class="p-3">หมายเหตุ</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const token=localStorage.token;if(!token)location.href='/';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};let subjects=[];async function load(){let s=await fetch('/api/student/dashboard',{headers:H}).then(r=>r.json());name.textContent=s.student.prefix+s.student.first_name+' '+s.student.last_name;cls.textContent=s.student.class_name;sid.textContent='เลขประจำตัว '+s.student.student_id;stats.innerHTML=[['ทั้งหมด',s.stats.total],['มาเรียน',s.stats.present],['สาย',s.stats.late],['ขาด',s.stats.absent],['ลา',s.stats.leave]].map(x=>`<div class="glass rounded-2xl p-5"><span class="text-gray-400">${x[0]}</span><div class="text-3xl font-bold mt-2">${x[1]}</div></div>`).join('');rows.innerHTML=s.recent.length?s.recent.map(x=>`<tr><td class="p-3">${x.attendance_date}</td><td class="p-3">${x.code} ${x.name}</td><td class="p-3">${x.status}</td><td class="p-3">${x.note||'-'}</td></tr>`).join(''):'<tr><td colspan="4" class="text-center p-8 text-gray-500">ยังไม่มีข้อมูล</td></tr>';subjects=await fetch('/api/subjects',{headers:H}).then(r=>r.json());sub.innerHTML=subjects.map(x=>`<option value="${x.id}">${x.code} ${x.name}</option>`).join('')}async function checkin(){let r=await fetch('/api/teacher/attendance',{headers:H});msg.textContent='';let res=await fetch('/api/student/attendance',{headers:H}).then(r=>r.json());let today=new Date().toISOString().slice(0,10);if(res.some(x=>x.attendance_date===today&&Number(x.subject_id)===Number(sub.value))){msg.textContent='วันนี้เช็กชื่อวิชานี้แล้ว';return}/* student self check-in endpoint intentionally handled below */let d={date:today,subject_id:Number(sub.value),records:[{student_id:(await fetch('/api/me',{headers:H}).then(x=>x.json())).user.student_id,status:'present',note:'เช็กชื่อด้วยตนเอง'}]};let z=await fetch('/api/teacher/attendance',{method:'POST',headers:H,body:JSON.stringify(d)});/* fallback is forbidden by role; show clear message */if(z.status===403)msg.textContent='บัญชีนี้ยังไม่ได้เปิดสิทธิ์เช็กชื่อด้วยตนเอง ให้ครูเป็นผู้บันทึก';else{msg.textContent='บันทึกแล้ว';load()}}function logout(){localStorage.removeItem('token');location.href='/'}load();</script></body></html>
