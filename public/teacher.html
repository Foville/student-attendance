<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ครู</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Kanit,sans-serif;background:#080808;color:#fff}.glass{background:#ffffff0d;border:1px solid #ffffff18;backdrop-filter:blur(18px)}input,select{background:#ffffff0d;color:#fff}option{background:#111}</style></head><body><nav class="glass p-4"><div class="max-w-7xl mx-auto flex justify-between"><b>👨‍🏫 ระบบเช็กชื่อครู</b><button onclick="logout()" class="px-4 py-2 rounded-xl bg-white/10">ออกจากระบบ</button></div></nav><main class="max-w-7xl mx-auto p-5"><div class="glass rounded-3xl p-6"><h1 class="text-2xl font-bold">เช็กชื่อนักเรียน</h1><div class="grid md:grid-cols-3 gap-3 mt-5"><input id="date" type="date" class="rounded-xl p-3"><select id="subject" class="rounded-xl p-3"></select><button onclick="loadList()" class="bg-white text-black rounded-xl p-3 font-semibold">โหลดรายชื่อ</button></div></div><div class="glass rounded-3xl p-5 mt-5 overflow-x-auto"><div class="flex justify-between mb-4"><h2 class="text-xl font-semibold">รายชื่อ 30 คน</h2><button onclick="save()" class="bg-white text-black rounded-xl px-5 py-2 font-semibold">💾 บันทึก</button></div><table class="w-full"><thead><tr class="text-gray-400"><th>เลขที่</th><th>รหัส</th><th>ชื่อ</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead><tbody id="body"></tbody></table><p id="msg" class="text-center mt-4"></p></div></main><script>const token=localStorage.token;if(!token)location.href='/';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};let students=[],existing=[];date.value=new Date().toISOString().slice(0,10);async function init(){students=await fetch('/api/teacher/students',{headers:H}).then(r=>r.json());let s=await fetch('/api/subjects',{headers:H}).then(r=>r.json());subject.innerHTML=s.map(x=>`<option value="${x.id}">${x.code} ${x.name}</option>`).join('');loadList()}async function loadList(){existing=await fetch(`/api/teacher/attendance?date=${date.value}&subject_id=${subject.value}`,{headers:H}).then(r=>r.json());body.innerHTML=students.map(x=>{let a=existing.find(y=>y.student_id===x.student_id);let st=a?.status||'absent';return `<tr><td class="p-3">${x.no}</td><td class="p-3">${x.student_id}</td><td class="p-3">${x.prefix}${x.first_name} ${x.last_name}</td><td class="p-3"><select data-id="${x.student_id}" class="status rounded-lg p-2"><option value="present" ${st==='present'?'selected':''}>มาเรียน</option><option value="late" ${st==='late'?'selected':''}>สาย</option><option value="absent" ${st==='absent'?'selected':''}>ขาด</option><option value="leave" ${st==='leave'?'selected':''}>ลา</option></select></td><td class="p-3"><input data-note="${x.student_id}" class="note rounded-lg p-2" value="${a?.note||''}" placeholder="หมายเหตุ"></td></tr>`}).join('')}async function save(){let records=[...document.querySelectorAll('.status')].map(s=>({student_id:s.dataset.id,status:s.value,note:document.querySelector(`[data-note="${s.dataset.id}"]`).value}));let r=await fetch('/api/teacher/attendance',{method:'POST',headers:H,body:JSON.stringify({date:date.value,subject_id:Number(subject.value),records})});let d=await r.json();msg.textContent=r.ok?'✓ บันทึกเรียบร้อย':d.error}function logout(){localStorage.removeItem('token');location.href='/'}init();</script></body></html>
